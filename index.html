<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIRSTWERK Vorschau</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090d;--ink:#f4f1ea;--mute:#9aa3ad}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 Inter,system-ui,sans-serif;min-height:100vh;padding:clamp(24px,6vw,80px) 16px}
h1{font:800 clamp(40px,7vw,96px)/.95 Archivo,sans-serif;letter-spacing:-.02em;max-width:1200px;margin:0 auto 40px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px;max-width:1200px;margin:0 auto}
a{display:block;padding:32px;border-radius:28px;text-decoration:none;color:inherit;border:1px solid rgba(255,255,255,.12);min-height:220px;transition:transform .25s}
a:hover{transform:translateY(-4px)}
a b{display:block;font:800 clamp(32px,4vw,52px)/1 Archivo,sans-serif;margin:10px 0 12px}
a span{color:var(--mute)}
.s{background:linear-gradient(135deg,#0b1222,#05070c);box-shadow:inset 0 -3px 0 #ff6a1a}
.o{background:linear-gradient(135deg,#1c1f24,#0d0f12);box-shadow:inset 0 -3px 0 #c8814f}
small{display:block;max-width:1200px;margin:32px auto 0;color:var(--mute);font-size:14px}
</style>
</head>
<body>
<h1>FIRSTWERK<br>Dachdecker-Vorschau</h1>
<div class="g">
  <a class="s" href="sturmnacht/"><span>Variante 2</span><b>Sturmnacht</b><span>Notdienst, Sturmschaden-Melder, Dach-Check, Karriere</span></a>
  <a class="o" href="von-oben/"><span>Variante 3</span><b>Von oben</b><span>Drohnenflug, Schiefer-Handwerk, Konfigurator, Solar, Karriere</span></a>
</div>
<small>Fiktiver Musterbetrieb · Demo-Seiten · Formulare senden nichts</small>
</body>
</html>
